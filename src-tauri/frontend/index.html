<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나라장터 경쟁사 영업성과</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #f5f6f8;
        color: #1f2937;
        font-family: "Malgun Gothic", "Segoe UI", sans-serif;
      }
      main { width: min(420px, calc(100% - 32px)); text-align: center; }
      h1 { margin: 0 0 10px; font-size: 20px; }
      p { margin: 0; color: #64748b; font-size: 13px; }
      .bar { height: 4px; margin-top: 22px; overflow: hidden; background: #dbe2ea; }
      .bar::after {
        display: block;
        width: 45%;
        height: 100%;
        background: #16324f;
        content: "";
        animation: loading 1.2s ease-in-out infinite alternate;
      }
      @keyframes loading { from { transform: translateX(-20%); } to { transform: translateX(140%); } }
    </style>
  </head>
  <body>
    <main>
      <h1>나라장터 경쟁사 영업성과</h1>
      <p>프로그램을 준비하고 있습니다.</p>
      <div class="bar" aria-hidden="true"></div>
    </main>
  </body>
</html>
